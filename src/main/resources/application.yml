server:
  port: ${PORT:8080}

spring:
  application:
    name: "zgrani"
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/zgrani
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
